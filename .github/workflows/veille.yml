name: Veille IA

# ─────────────────────────────────────────────────────────────
#  Objectif : le digest Telegram tombe vers 8h00-8h30 heure de Paris.
#
#  Pourquoi une FENÊTRE de tentatives et non un seul cron ?
#  Les workflows `schedule` de GitHub partent d'une file d'attente
#  « best effort » : un cron à 05:00 UTC a démarré entre 08:44 et
#  11:26 UTC fin août / début septembre 2026 (digest reçu vers midi,
#  à heure fluctuante). On tente donc toutes les 20 minutes sur une
#  fenêtre : la PREMIÈRE tentative qui démarre réellement après
#  PARIS_EARLIEST publie, les suivantes voient l'état du jour
#  (.state/last_run.txt) et s'arrêtent immédiatement.
#
#  Les crons sont en UTC (GitHub ignore l'heure d'été). La fenêtre
#  06:03 → 09:43 UTC couvre 08:03 → 11:43 à Paris en été et
#  07:03 → 10:43 en hiver ; c'est le garde-fou ci-dessous qui
#  raisonne en Europe/Paris, donc l'heure de publication NE BOUGE PAS
#  au changement d'heure.
#
#  Réglage : PARIS_EARLIEST (plus bas) = heure de Paris à partir de
#  laquelle la publication est autorisée. C'est le seul curseur à
#  toucher pour avancer/reculer le digest.
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    # Minutes volontairement décalées (03/23/43) : les marques :00 et
    # :30 sont les plus encombrées côté GitHub.
    - cron: "3,23,43 6 * * *"
    - cron: "3,23,43 7 * * *"
    - cron: "3,23,43 8 * * *"
    - cron: "3,23,43 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test à vide : affiche le digest dans les logs SANS publier sur Telegram"
        type: boolean
        default: false

# Évite deux exécutions simultanées (et met les tentatives en file,
# donc chacune voit bien l'état laissé par la précédente).
concurrency:
  group: veille-ia
  cancel-in-progress: false

# Autorise le job à committer feed.json/seen.json/état dans ce repo.
permissions:
  contents: write

env:
  # Heure de Paris à partir de laquelle on publie (HH:MM).
  PARIS_EARLIEST: "08:00"
  # Mémoire « digest déjà publié aujourd'hui ».
  STATE_FILE: .state/last_run.txt

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # ── Garde-fou horaire + anti-doublon ──────────────────────
      #  Un déclenchement manuel passe toujours (c'est le but d'un
      #  « Run workflow »).
      - name: Faut-il publier maintenant ?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Paris"))
          today = now.strftime("%Y-%m-%d")
          earliest = os.environ["PARIS_EARLIEST"]
          hh, mm = (int(x) for x in earliest.split(":"))

          state = pathlib.Path(os.environ["STATE_FILE"])
          last = state.read_text().strip() if state.exists() else "(aucun)"

          if os.environ["EVENT"] == "workflow_dispatch":
              go, why = True, "déclenchement manuel → on publie sans condition"
          elif last == today:
              go, why = False, f"digest du {today} déjà publié → on s'arrête"
          elif (now.hour, now.minute) < (hh, mm):
              go, why = False, (
                  f"trop tôt : {now:%H:%M} à Paris, fenêtre ouverte à partir de {earliest}"
              )
          else:
              go, why = True, f"go : {now:%H:%M} à Paris, digest du jour pas encore parti"

          print(f"Heure de Paris   : {now:%Y-%m-%d %H:%M}")
          print(f"Dernier digest   : {last}")
          print(f"Décision         : {why}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if go else 'false'}\n")
              out.write(f"today={today}\n")
          PY

      - name: Installer Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Lancer la veille
        if: steps.gate.outputs.run == 'true'
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m veille.main "${args[@]}"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Le secret côté repo s'appelle TELEGRAM_CHANNEL_ID ; le code accepte
          # ce nom. (Telegram est optionnel : absent → publication sautée.)
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

      # Persiste feed.json (cumulatif), seen.json (mémoire dédup) et
      # l'état du jour dans CE repo. Sauté en dry-run (rien n'a été écrit,
      # et on ne veut pas marquer la journée comme faite).
      - name: Sauvegarder feed.json / seen.json / état du jour
        if: ${{ steps.gate.outputs.run == 'true' && !inputs.dry_run }}
        env:
          TODAY: ${{ steps.gate.outputs.today }}
        run: |
          mkdir -p "$(dirname "$STATE_FILE")"
          printf '%s\n' "$TODAY" > "$STATE_FILE"
          if [ -n "$(git status --porcelain feed.json seen.json "$STATE_FILE")" ]; then
            git config user.name "veille-bot"
            git config user.email "veille-bot@users.noreply.github.com"
            git add feed.json seen.json "$STATE_FILE"
            git commit -m "data: maj feed.json/seen.json ($TODAY)"
            # Une autre action a pu pousser entre-temps (enrichissement…).
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Aucun changement de données à committer."
          fi

      # Bridge vers le site : pousse feed.json dans knowledge-hub.
      # Le garde-fou « token absent → on saute » est dans le script (le
      # contexte `secrets` n'est PAS autorisé dans un `if:` GitHub Actions).
      - name: Publier feed.json vers knowledge-hub
        if: ${{ steps.gate.outputs.run == 'true' && !inputs.dry_run }}
        env:
          KH_REPO_TOKEN: ${{ secrets.KH_REPO_TOKEN }}
          KH_REPO: hl-works/knowledge-hub
          KH_BRANCH: main
          KH_FEED_PATH: knowledge-hub/veille-ia/feed.json
        run: |
          set -e
          # Tant que le site n'est pas prêt (pas de token), on saute proprement.
          if [ -z "$KH_REPO_TOKEN" ]; then
            echo "KH_REPO_TOKEN absent → bridge désactivé, publication site sautée."
            exit 0
          fi
          # Garde-fou : ne jamais pousser un JSON invalide (sinon la page site
          # affiche « Veille indisponible »).
          python -c "import json; json.load(open('feed.json'))"
          echo "✓ feed.json est un JSON valide."

          # Clone complet (on se resynchronise sur le distant à chaque essai).
          git clone "https://x-access-token:${KH_REPO_TOKEN}@github.com/${KH_REPO}.git" kh
          cd kh
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"

          # Notre feed.json est la SOURCE DE VÉRITÉ (fichier cumulatif complet
          # généré côté veille-ia). On ÉCRASE la version du site, on ne la
          # fusionne pas → aucun conflit de merge possible. Si le push est
          # rejeté (une autre source a poussé entre-temps), on se recale sur
          # la dernière version distante et on réécrase.
          for attempt in 1 2 3; do
            git fetch origin "$KH_BRANCH"
            git reset --hard "origin/$KH_BRANCH"

            mkdir -p "$(dirname "$KH_FEED_PATH")"
            cp ../feed.json "$KH_FEED_PATH"

            if [ -z "$(git status --porcelain "$KH_FEED_PATH")" ]; then
              echo "feed.json déjà à jour dans knowledge-hub, rien à pousser."
              exit 0
            fi

            git add "$KH_FEED_PATH"
            git commit -m "data: maj feed.json depuis veille-ia ($(date -u +%F))"

            if git push origin "HEAD:$KH_BRANCH"; then
              echo "✓ feed.json publié sur ${KH_REPO}@${KH_BRANCH}."
              exit 0
            fi
            echo "Push rejeté (tentative $attempt), resynchronisation…"
            sleep 3
          done
          echo "Échec du push vers knowledge-hub après 3 tentatives." >&2
          exit 1
