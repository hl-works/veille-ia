name: Veille IA

# ─────────────────────────────────────────────────────────────
#  Lance le bot automatiquement chaque matin, et permet aussi un
#  déclenchement manuel depuis l'onglet "Actions" de GitHub.
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    # 05:00 UTC = 7h à Paris en été (heure actuelle) / 6h en hiver.
    # (GitHub Actions raisonne en UTC, sans heure d'été : on vise ~7h le matin.)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test à vide : affiche le digest dans les logs SANS publier sur Telegram"
        type: boolean
        default: false

# Évite deux exécutions simultanées.
concurrency:
  group: veille-ia
  cancel-in-progress: false

# Autorise le job à committer feed.json/seen.json dans ce repo.
permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la veille
        run: python -m veille.main ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Persiste feed.json (cumulatif) et seen.json (mémoire dédup) dans CE repo.
      # Sauté en dry-run (rien n'a été écrit).
      - name: Sauvegarder feed.json / seen.json
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain feed.json seen.json)" ]; then
            git config user.name "veille-bot"
            git config user.email "veille-bot@users.noreply.github.com"
            git add feed.json seen.json
            git commit -m "data: maj feed.json/seen.json ($(date -u +%F))"
            git push
          else
            echo "Aucun changement de données à committer."
          fi

      # Bridge vers le site : pousse feed.json dans knowledge-hub.
      # NE S'ACTIVE QUE si le secret KH_REPO_TOKEN est défini → tant que le
      # site n'est pas prêt, cette étape est silencieusement sautée.
      - name: Publier feed.json vers knowledge-hub
        if: ${{ !inputs.dry_run && secrets.KH_REPO_TOKEN != '' }}
        env:
          KH_REPO_TOKEN: ${{ secrets.KH_REPO_TOKEN }}
          KH_REPO: hugolahutte/knowledge-hub
          KH_BRANCH: main
          KH_FEED_PATH: veille-ia/feed.json
        run: |
          set -e
          # Garde-fou : ne jamais pousser un JSON invalide (sinon la page site
          # affiche « Veille indisponible »).
          python -c "import json; json.load(open('feed.json'))"
          echo "✓ feed.json est un JSON valide."

          # Clone complet (pas --depth 1) pour pouvoir rebaser avant push.
          git clone "https://x-access-token:${KH_REPO_TOKEN}@github.com/${KH_REPO}.git" kh
          cd kh
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"

          mkdir -p "$(dirname "$KH_FEED_PATH")"
          cp ../feed.json "$KH_FEED_PATH"

          if [ -z "$(git status --porcelain "$KH_FEED_PATH")" ]; then
            echo "feed.json déjà à jour dans knowledge-hub, rien à pousser."
            exit 0
          fi

          git add "$KH_FEED_PATH"
          git commit -m "data: maj feed.json depuis veille-ia ($(date -u +%F))"

          # Plusieurs sources poussent sur main → rebase avant push, et retry
          # en cas de course (rejet non-fast-forward).
          for attempt in 1 2 3; do
            git pull --rebase origin "$KH_BRANCH"
            if git push origin "HEAD:$KH_BRANCH"; then
              echo "✓ feed.json publié sur ${KH_REPO}@${KH_BRANCH}."
              exit 0
            fi
            echo "Push rejeté (tentative $attempt), nouvelle tentative…"
            sleep 3
          done
          echo "Échec du push vers knowledge-hub après 3 tentatives." >&2
          exit 1
