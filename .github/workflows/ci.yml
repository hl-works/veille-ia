name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate environment
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q veille
      - name: Check Anthropic API compatibility
        run: |
          python - <<'PY'
          import inspect
          import anthropic

          major = int(anthropic.__version__.split(".", 1)[0])
          assert major == 0, f"unexpected Anthropic major: {anthropic.__version__}"
          client = anthropic.Anthropic(api_key="ci-placeholder")
          parameters = inspect.signature(client.messages.create).parameters
          required = {"thinking", "output_config"}
          missing = required.difference(parameters)
          assert not missing, f"missing Messages.create parameters: {sorted(missing)}"
          PY
