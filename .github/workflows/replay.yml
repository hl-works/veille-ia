name: Rejeu digest Telegram

# ─────────────────────────────────────────────────────────────
#  Republie le digest Telegram (nouveau format détaillé) pour les
#  N derniers jours — un message par jour. Déclenchement MANUEL
#  uniquement (jamais de cron) pour éviter tout envoi surprise.
#
#  Onglet Actions → « Rejeu digest Telegram » → Run workflow :
#   • days    : nombre de derniers jours à rejouer (1 = test du dernier jour)
#   • dry_run : true = aperçu dans les logs SANS publier sur Telegram
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Nombre de derniers jours à rejouer (ex. 1 pour tester, 7 pour la semaine)"
        type: string
        default: "1"
      dry_run:
        description: "Aperçu seul (ne publie pas sur Telegram)"
        type: boolean
        default: true

concurrency:
  group: veille-ia-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Installer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Rejouer les N derniers jours
        run: |
          args=(--days "$DAYS")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m veille.replay "${args[@]}"
        env:
          DAYS: ${{ inputs.days }}
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
