name: Backfill feed.json

# ─────────────────────────────────────────────────────────────
#  One-shot manuel : génère le feed.json initial sur une période
#  passée (par défaut mai 2026). À lancer une seule fois pour le
#  contenu de lancement du site. Borné en budget (plafond tweets).
# ─────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Date de début (YYYY-MM-DD, incluse)"
        type: string
        default: "2026-05-01"
      until:
        description: "Date de fin (YYYY-MM-DD, exclue)"
        type: string
        default: "2026-06-01"
      max_per_account:
        description: "Quota de tweets par compte (équité entre les 45 comptes)"
        type: string
        default: "25"
      max_tweets:
        description: "Garde-fou global strict (budget)"
        type: string
        default: "1500"
      write:
        description: "Écrire feed.json (sinon dry-run d'aperçu)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Installer Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le backfill
        run: |
          args=(
            --since "$SINCE"
            --until "$UNTIL"
            --max-per-account "$MAX_PER_ACCOUNT"
            --max-tweets "$MAX_TWEETS"
          )
          if [[ "$WRITE_OUTPUT" == "true" ]]; then
            args+=(--write)
          fi
          python -m veille.backfill "${args[@]}"
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          MAX_PER_ACCOUNT: ${{ inputs.max_per_account }}
          MAX_TWEETS: ${{ inputs.max_tweets }}
          WRITE_OUTPUT: ${{ inputs.write }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}

      - name: Sauvegarder feed.json / seen.json
        if: ${{ inputs.write }}
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
        run: |
          if [ -n "$(git status --porcelain feed.json seen.json)" ]; then
            git config user.name "veille-bot"
            git config user.email "veille-bot@users.noreply.github.com"
            git add feed.json seen.json
            git commit -m "data: backfill feed.json (${SINCE} → ${UNTIL})"
            git push
          else
            echo "Aucune donnée générée."
          fi
