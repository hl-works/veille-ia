# ── Fenêtre de récupération ───────────────────────────────────
#  On ne garde que les tweets publiés dans les N dernières heures.
#  24 = la dernière journée (parfait pour un digest quotidien).
lookback_hours: 24

#  Nombre max de tweets récupérés par compte (avant filtrage).
max_tweets_per_account: 20

# ── Filtres anti-bruit ────────────────────────────────────────
include_retweets: false   # ignorer les simples retweets
include_replies: false    # ignorer les réponses à d'autres tweets

# ── Rédaction du digest ───────────────────────────────────────
#  Modèle Claude utilisé pour rédiger. claude-opus-4-8 = le plus
#  qualitatif. Pour réduire le coût, tu peux mettre claude-sonnet-4-6.
model: claude-opus-4-8
language: français

#  Profondeur du digest Telegram :
#   • detaille  (défaut) → digest DÉVELOPPÉ, pensé pour être lu SANS ouvrir les
#                liens (parfait hors ligne) : « l'essentiel en 30 s » + chaque
#                sujet expliqué à fond (le fait, les détails, le pourquoi).
#   • essentiel → digest court à l'ancienne (survol rapide, moins de tokens).
digest_depth: detaille

# ── Sources complémentaires (en plus de X) ────────────────────
#  Ces sources enrichissent le DIGEST TELEGRAM uniquement — elles ne
#  touchent PAS au feed.json du site.
sources:
  hacker_news: true            # meilleures actus IA de Hacker News (gratuit, sans clé)
  hacker_news_min_score: 60    # score minimum (points) pour retenir une actu
  rss: true                    # billets récents des blogs officiels (via RSS)
  youtube: true                # nouvelles vidéos des chaînes YouTube suivies (via RSS, sans clé)
  youtube_ai_filter: false     # true = ne garder que les vidéos au titre « IA »
                               #  (utile si tu ajoutes des chaînes GÉNÉRALISTES type Micode)

#  Flux RSS suivis (édite librement). Un flux mort/injoignable est simplement
#  ignoré — jamais bloquant. Astuce : garde des sources PRIMAIRES (blogs des
#  labos) pour croiser avec X et fiabiliser l'info.
rss_feeds:
  - https://simonwillison.net/atom/everything/                          # Simon Willison (LLM en pratique)
  - https://huggingface.co/blog/feed.xml                                # Hugging Face (open source)
  - https://openai.com/news/rss.xml                                     # OpenAI (blog officiel)
  - https://deepmind.google/blog/rss.xml                                # Google DeepMind
  - https://blog.google/technology/ai/rss/                              # Google AI
  - https://jack-clark.net/feed/                                        # Import AI (Jack Clark)
  - https://www.technologyreview.com/topic/artificial-intelligence/feed/ # MIT Tech Review — IA

